services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development-dependencies-env
    restart: unless-stopped
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "${PORT:-5173}:5173"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    develop:
      watch:
        # Source files: sync inside container, Vite HMR reloads automatically
        - action: sync
          path: ./app
          target: /app/app
        - action: sync
          path: ./public
          target: /app/public

        # Config files: sync + dev server restart
        - action: sync+restart
          path: ./vite.config.ts
          target: /app/vite.config.ts
        - action: sync+restart
          path: ./react-router.config.ts
          target: /app/react-router.config.ts

        # Rebuild image on dependency change
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
